<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - SunKart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">SunKart</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/cart">Cart</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Shopping Cart</h2>
        
        <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
            Your cart is empty. <a href="/products">Continue shopping</a>
        </div>
        
        <div th:unless="${#lists.isEmpty(cartItems)}">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td>
                            <div class="d-flex align-items-center">
                                <img th:src="${item.product.imageUrl}" alt="Product" class="img-thumbnail" style="width: 60px; height: 60px; object-fit: cover;">
                                <span class="ms-3" th:text="${item.product.name}">Product Name</span>
                            </div>
                        </td>
                        <td>₹<span th:text="${item.product.price}">0</span></td>
                        <td>
                            <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post" class="d-inline">
                                <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control" style="width: 80px;">
                                <button type="submit" class="btn btn-sm btn-secondary mt-1">Update</button>
                            </form>
                        </td>
                        <td>₹<span th:text="${item.totalPrice}">0</span></td>
                        <td>
                            <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="row mt-4">
                <div class="col-md-6 offset-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5>Cart Total</h5>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <strong>Total:</strong>
                                <strong>₹<span th:text="${total}">0</span></strong>
                            </div>
                            <hr>
                            <a href="/checkout" class="btn btn-success w-100">Proceed to Checkout</a>
                            <a href="/products" class="btn btn-outline-secondary w-100 mt-2">Continue Shopping</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
