<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunKart - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 0;
        }
        .search-box {
            max-width: 600px;
            margin: 0 auto;
        }
        .product-card {
            transition: transform 0.2s;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .product-img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🛒 SunKart</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="/orders">My Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin">Admin</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section with Search -->
    <div class="hero-section">
        <div class="container text-center">
            <h1 class="display-4 fw-bold mb-3">Welcome to SunKart</h1>
            <p class="lead mb-4">Your one-stop shop for everything you need!</p>
            
            <!-- Search Box -->
            <div class="search-box">
                <form action="/products" method="get">
                    <div class="input-group input-group-lg shadow">
                        <input type="text" 
                               class="form-control" 
                               name="search" 
                               placeholder="Search for products, brands, categories..."
                               aria-label="Search">
                        <button class="btn btn-light" type="submit">
                            🔍 Search
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="mt-4">
                <a href="/products" class="btn btn-light btn-lg me-2">Browse All Products</a>
                <a href="/products?category=Electronics" class="btn btn-outline-light btn-lg">Electronics</a>
            </div>
        </div>
    </div>

    <!-- Featured Products -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Featured Products</h2>
        
        <div class="row g-4">
            <div class="col-md-3" th:each="product : ${products}">
                <div class="card product-card">
                    <img th:src="${product.imageUrl}" 
                         class="card-img-top product-img" 
                         th:alt="${product.name}"
                         onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2" th:text="${product.category}">Category</span>
                        <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                        <p class="card-text text-muted small" th:text="${product.description}">Description</p>
                        <p class="text-success fw-bold fs-5">₹<span th:text="${product.price}">0</span></p>
                        <div class="d-grid gap-2">
                            <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-outline-primary btn-sm">
                                View Details
                            </a>
                            <form th:action="@{/cart/add}" method="post">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-primary btn-sm w-100">
                                    🛒 Add to Cart
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 SunKart. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
